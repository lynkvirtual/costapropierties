<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Costa Properties Ixtapa | Bienes Raíces</title>
<meta name="description" content="Compra, renta y desarrollo de propiedades en Ixtapa–Zihuatanejo.">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@400;500;600&display=swap">
<style>
:root{--n:#143057;--c:#faf8f4;--m:#4a5b78;--l:#d8dde6}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--c);color:var(--n);font-family:Manrope,sans-serif}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400;margin:0}
header{position:fixed;inset:0 0 auto;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 40px;background:var(--n);color:#fff}
header img{height:60px;display:block}.hl{width:min(380px,70vw);height:auto;margin-bottom:8px}nav{display:flex;gap:28px;font-size:14px}
.hero{min-height:100vh;background:var(--n);color:#fff;padding:140px 40px 80px;display:flex;flex-direction:column;justify-content:flex-end;gap:28px}
.hero h1{font-size:clamp(52px,9vw,130px);line-height:.95;max-width:1000px}
.hero p{max-width:540px;font-size:18px;line-height:1.6;color:#dbe4f3;margin:0}
.btn{display:inline-block;padding:16px 32px;border-radius:999px;font-weight:600;border:1px solid var(--n);background:var(--n);color:#fff;cursor:pointer;font:inherit;font-weight:600}
.btn.w{background:#fff;color:var(--n);border-color:#fff}.btn.o{background:none;border-color:#fff;color:#fff}
section{padding:90px 40px}
.bar{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:20px;margin-bottom:24px}
.bar h2,.srv h2,.ct h2{font-size:clamp(40px,6vw,64px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.chip{border:1px solid var(--n);background:none;color:var(--n);border-radius:999px;padding:10px 20px;min-height:44px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--n);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:32px}
.card{display:flex;flex-direction:column;gap:10px;transition:transform .3s}.card:hover{transform:translateY(-5px)}
.ph{height:340px;border-radius:20px;background:#dfe6f2 center/cover;position:relative;overflow:hidden}
.tag{position:absolute;top:14px;left:14px;background:var(--n);color:#fff;font-size:12px;letter-spacing:.1em;padding:7px 14px;border-radius:999px;text-transform:uppercase}
.card small{color:var(--m)}.card h3{font-size:30px}
.srv{background:#fff}.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border-top:1px solid var(--l);margin-top:32px}
.sl div{padding:22px 0;border-bottom:1px solid var(--l);font-size:20px}
.ct{background:var(--n);color:#fff;display:flex;flex-direction:column;gap:24px}.ct p{line-height:1.7;color:#dbe4f3;margin:0}
.rv{opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
.det{padding-top:110px}.gal{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin:24px 0}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:20px;min-height:200px;max-height:520px}
.cols{display:flex;gap:48px;flex-wrap:wrap}.cols>div{flex:2;min-width:300px}.cols aside{flex:1;min-width:280px;background:#fff;border-radius:20px;padding:32px;align-self:flex-start;display:flex;flex-direction:column;gap:18px}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--l);margin:28px 0}
.specs div{padding:18px 0;border-bottom:1px solid var(--l);font-size:13px;color:var(--m)}.specs b{display:block;font:400 26px 'Cormorant Garamond',serif;color:var(--n)}
iframe{width:100%;height:340px;border:0;border-radius:20px}
@media(max-width:700px){header{padding:10px 20px}nav{gap:16px}section,.hero{padding-left:20px;padding-right:20px}.gal{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.rv{transition:none;opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><a href="#/"><img src="logo.png" alt="Costa Properties Ixtapa Bienes Raíces"></a>
<nav><a href="#/">Propiedades</a><a href="#servicios">Servicios</a><a href="#contacto">Contacto</a></nav></header>
<main id="app"></main>
<script>
// ====== CONFIGURACIÓN (pegar datos de Supabase > Project Settings > API) ======
const SB_URL='https://nzvymnonhjyfhmhnarzn.supabase.co', SB_KEY='sb_publishable_AiboQE3yv7tXurBqph_NHg_20J4L2CP', WA='523314365457';
// ===============================================================================
const SERV=['Desarrollos inmobiliarios','Lotificaciones','Avalúos','Compra y venta','Rentas vacacionales','Construcción y remodelación','Administración de inmuebles','Levantamientos topográficos','Asesoría jurídica inmobiliaria','Renta de maquinaria','Diseños'];
const CATS=['Casas','Departamentos','Terrenos','Locales','Desarrollos','Rentas vacacionales'];
const $=document.getElementById('app');let DATA=[],F={op:'',cat:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const per=p=>p.operacion==='renta'?({dia:' / día',semana:' / semana',mes:' / mes'}[p.periodo||'mes']):'';
const money=p=>p.precio?new Intl.NumberFormat('es-MX').format(p.precio)+' '+esc(p.moneda||'MXN'):'Consultar precio';
async function load(){try{const r=await fetch(SB_URL+'/rest/v1/propiedades?publicada=eq.true&order=creado.desc',{headers:{apikey:SB_KEY}});DATA=r.ok?await r.json():[]}catch(e){DATA=[]}route()}
function reveal(){const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');o.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.rv').forEach(x=>o.observe(x))}
function card(p){return `<a class="card rv" href="#/p/${p.id}"><div class="ph" style="${p.fotos&&p.fotos[0]?`background-image:url('${esc(p.fotos[0])}')`:''}"><span class="tag">${esc(p.operacion)}</span></div><small>${esc(p.categoria)} · ${esc((p.direccion||'').split(',')[0])}</small><h3>${esc(p.titulo)}</h3><b>${money(p)}${per(p)}</b></a>`}
function home(){const L=DATA.filter(p=>(!F.op||p.operacion===F.op)&&(!F.cat||p.categoria===F.cat));
$.innerHTML=`<div class="hero"><img class="hl" src="logo.png" alt="Costa Properties Ixtapa Bienes Raíces"><small style="letter-spacing:.24em;color:#c9d6ec">BIENES RAÍCES · IXTAPA–ZIHUATANEJO</small><h1>Un lugar para vivir frente al Pacífico.</h1><p>Compra, renta y desarrollo de propiedades en la Costa Grande de Guerrero, con asesoría jurídica y administración de principio a fin.</p><div><a class="btn w" href="#propiedades">Ver propiedades</a> <a class="btn o" href="https://wa.me/${WA}">WhatsApp</a></div></div>
<section id="propiedades"><div class="bar rv"><h2>Propiedades</h2><div class="chips">${[['','Todas'],['compra','Compra'],['renta','Renta']].map(([v,t])=>`<button class="chip ${F.op===v?'on':''}" data-op="${v}">${t}</button>`).join('')}</div></div>
<div class="chips">${['',...CATS].map(c=>`<button class="chip ${F.cat===c?'on':''}" data-cat="${c}">${c||'Todas las categorías'}</button>`).join('')}</div>
<div class="grid">${L.length?L.map(card).join(''):'<p>Próximamente nuevas propiedades. Escríbenos por WhatsApp.</p>'}</div></section>
<section id="servicios" class="srv"><h2 class="rv">Todo el proceso inmobiliario, en un solo lugar.</h2><div class="sl rv">${SERV.map(s=>`<div>${s}</div>`).join('')}</div></section>
<section id="contacto" class="ct"><img class="hl" src="logo.png" alt="Costa Properties Ixtapa" style="width:260px"><h2 class="rv">Hablemos de tu próxima propiedad.</h2><p class="rv">Ing. Cosme Alberto Ramírez Aguilar<br>Paseo de Zihuatanejo, Col. El Limón, Zihuatanejo, Guerrero<br>costapropertiesixtapa@gmail.com · Instagram y TikTok: costapropertiesixtapa</p><div><a class="btn w" href="https://wa.me/${WA}">WhatsApp 331 436 5457</a></div></section>`;
$.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{F.op=b.dataset.op;home()});
$.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{F.cat=b.dataset.cat;home()});reveal()}
function detail(id){const p=DATA.find(x=>x.id==id);if(!p){$.innerHTML='<section class="det"><a href="#/">← Volver</a><h2>Propiedad no encontrada</h2></section>';return}
const f=p.fotos||[];const msg=encodeURIComponent(`Hola, me interesa: ${p.titulo} (${p.operacion}). ¿Me dan información?`);
const sp=[['Recámaras',p.recamaras],['Baños',p.banos],['Terreno m²',p.terreno_m2],['Construcción m²',p.construccion_m2]].filter(x=>x[1]!=null);
document.title=p.titulo+' | Costa Properties Ixtapa';
$.innerHTML=`<section class="det"><a href="#/">← Todas las propiedades</a><p style="color:var(--m)">${esc(p.operacion)} · ${esc(p.categoria)}</p><h1 style="font-size:clamp(40px,6vw,84px)">${esc(p.titulo)}</h1>
${f.length?`<div class="gal"><img src="${esc(f[0])}" alt="${esc(p.titulo)}">${f[1]?`<div style="display:grid;gap:14px">${f.slice(1,3).map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>`:''}</div>`:''}
<div class="cols"><div><p style="font-size:18px;line-height:1.7;white-space:pre-line">${esc(p.descripcion)}</p><div class="specs">${sp.map(s=>`<div>${s[0]}<b>${esc(s[1])}</b></div>`).join('')}</div>
${p.direccion?`<h3 style="font-size:32px;margin-bottom:8px">Ubicación</h3><p>${esc(p.direccion)}</p><iframe loading="lazy" title="Mapa" src="https://maps.google.com/maps?q=${encodeURIComponent(p.direccion)}&output=embed"></iframe>`:''}
${f.length>3?`<div class="gal" style="grid-template-columns:1fr 1fr">${f.slice(3).map(u=>`<img src="${esc(u)}" alt="">`).join('')}</div>`:''}</div>
<aside><small>PRECIO</small><h2 style="font-size:46px">${money(p)}<small>${per(p)}</small></h2><a class="btn" href="https://wa.me/${WA}?text=${msg}">${p.operacion==='renta'?'Reservar / consultar':'Información de compra'} por WhatsApp</a><small>Ing. Cosme Alberto Ramírez Aguilar · 331 436 5457</small></aside></div></section>`;scrollTo(0,0)}
function route(){const m=location.hash.match(/^#\/p\/(\d+)/);if(m)return detail(m[1]);document.title='Costa Properties Ixtapa | Bienes Raíces';home()}
addEventListener('hashchange',()=>{if(!location.hash.startsWith('#/')&&document.getElementById(location.hash.slice(1)))return;route()});load();
</script>
</body>
</html>
