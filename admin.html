<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel | Costa Properties</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#12305c;font-family:system-ui,sans-serif;padding:24px}
.w{max-width:760px;margin:auto}h1{font-weight:500}label{display:block;font-size:13px;margin-top:14px;color:#4a5b78}
input,select,textarea{width:100%;padding:12px;border:1px solid #c5ccd8;border-radius:10px;font:inherit;margin-top:4px;background:#fff}
.r{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{background:#12305c;color:#fff;border:0;border-radius:999px;padding:14px 28px;font:inherit;font-weight:600;cursor:pointer;margin-top:20px;min-height:44px}
button.s{background:none;color:#12305c;border:1px solid #12305c;padding:8px 16px;margin:0}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #d8dde6}
#msg{margin-top:14px;font-weight:600}.hide{display:none}
</style>
</head>
<body><div class="w">
<img src="logo.png" alt="Costa Properties Ixtapa" style="height:56px;display:block;margin-bottom:12px;border-radius:6px"><h1>Panel de propiedades</h1>
<form id="lg"><label>Correo<input id="em" type="email" required></label><label>Contraseña<input id="pw" type="password" required></label><button>Entrar</button></form>
<div id="ad" class="hide">
<button class="s" id="out" type="button">Cerrar sesión</button>
<h2>Nueva propiedad</h2>
<form id="f">
<label>Título<input name="titulo" required></label>
<div class="r"><label>Operación<select name="operacion"><option value="compra">Compra</option><option value="renta">Renta</option></select></label>
<label>Categoría<select name="categoria"><option>Casas</option><option>Departamentos</option><option>Terrenos</option><option>Locales</option><option>Desarrollos</option><option>Rentas vacacionales</option></select></label></div>
<div class="r"><label>Precio<input name="precio" type="number" step="any"></label><label>Moneda<select name="moneda"><option>MXN</option><option>USD</option></select></label></div>
<label>Dirección completa (se usa para el mapa)<input name="direccion"></label>
<label>Descripción<textarea name="descripcion" rows="5"></textarea></label>
<div class="r"><label>Recámaras<input name="recamaras" type="number"></label><label>Baños<input name="banos" type="number"></label>
<label>Terreno m²<input name="terreno_m2" type="number" step="any"></label><label>Construcción m²<input name="construccion_m2" type="number" step="any"></label></div>
<label>Fotos (la primera es la portada)<input id="ph" type="file" accept="image/*" multiple></label>
<button>Guardar propiedad</button></form>
<p id="msg" role="status"></p>
<h2>Propiedades publicadas</h2><div id="ls"></div>
</div>
<script>
const SB_URL='https://nzvymnonhjyfhmhnarzn.supabase.co', SB_KEY='sb_publishable_AiboQE3yv7tXurBqph_NHg_20J4L2CP';
const $=id=>document.getElementById(id);let T=sessionStorage.getItem('t');
const H=(x={})=>({apikey:SB_KEY,Authorization:'Bearer '+(T||SB_KEY),...x});
const say=t=>$('msg').textContent=t;
function show(){$('lg').classList.toggle('hide',!!T);$('ad').classList.toggle('hide',!T);if(T)list()}
$('lg').onsubmit=async e=>{e.preventDefault();const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value,password:$('pw').value})});const j=await r.json();if(!r.ok)return alert('Correo o contraseña incorrectos');T=j.access_token;sessionStorage.setItem('t',T);show()};
$('out').onclick=()=>{sessionStorage.removeItem('t');T=null;show()};
async function list(){const r=await fetch(SB_URL+'/rest/v1/propiedades?select=id,titulo,operacion,categoria&order=creado.desc',{headers:H()});if(r.status===401){$('out').click();return}
const d=await r.json();$('ls').innerHTML='';d.forEach(p=>{const row=document.createElement('div');row.className='it';const s=document.createElement('span');s.textContent=`${p.titulo} · ${p.operacion} · ${p.categoria}`;const b=document.createElement('button');b.className='s';b.textContent='Eliminar';b.onclick=async()=>{if(!confirm('¿Eliminar "'+p.titulo+'"?'))return;await fetch(SB_URL+'/rest/v1/propiedades?id=eq.'+p.id,{method:'DELETE',headers:H()});list()};row.append(s,b);$('ls').append(row)})}
$('f').onsubmit=async e=>{e.preventDefault();say('Subiendo fotos…');const fd=new FormData(e.target),o={};
fd.forEach((v,k)=>{o[k]=v===''?null:v});['precio','recamaras','banos','terreno_m2','construccion_m2'].forEach(k=>{if(o[k]!=null)o[k]=Number(o[k])});
o.fotos=[];for(const f of $('ph').files){const n=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');const u=await fetch(SB_URL+'/storage/v1/object/fotos/'+n,{method:'POST',headers:H({'Content-Type':f.type}),body:f});if(!u.ok){say('Error al subir '+f.name);return}o.fotos.push(SB_URL+'/storage/v1/object/public/fotos/'+n)}
const r=await fetch(SB_URL+'/rest/v1/propiedades',{method:'POST',headers:H({'Content-Type':'application/json'}),body:JSON.stringify(o)});
if(r.ok){say('Propiedad guardada ✔');e.target.reset();list()}else say('Error al guardar: '+await r.text())};
show();
</script></div></body></html>
